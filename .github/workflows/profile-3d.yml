name: GitHub-Profile-3D-Contrib

on:
  # Generate the graph as soon as this workflow is first installed or updated.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-3d.yml"
  schedule:
    # Run daily at 03:00 Philippine Standard Time (19:00 UTC).
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub profile 3D contribution graph
    steps:
      - uses: actions/checkout@v5

      - name: Select the latest calendar year
        run: echo "CURRENT_YEAR=$(date -u +%Y)" >> "$GITHUB_ENV"

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: ${{ env.CURRENT_YEAR }}

      - name: Commit generated graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git commit -m "chore: update 3D contribution graph"; then
            git push
          fi
